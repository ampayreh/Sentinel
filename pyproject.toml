[project]
name = "sentinel"
version = "0.1.0"
description = "Runtime assurance layer for AI-native autonomous systems"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<25",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "click>=8.1,<9",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "httpx>=0.27",
    "pandas>=2.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "onnx>=1.16",
    "onnxscript>=0.2",
]
eval = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML",
]

[project.scripts]
sentinel = "sentinel.demo.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501", "UP042"]  # UP042: keep `str, Enum` (not StrEnum) for pydantic v2 JSON schema compat

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
